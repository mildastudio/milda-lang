name: Publish

# Publishes the `milda` package to npm. Trigger by publishing a GitHub Release
# (tag = the version), or manually. Requires the NPM_TOKEN secret (an npm
# automation/granular token with publish rights). Publish `milda` BEFORE the
# @mildastudio/* engine packages — they depend on it.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
